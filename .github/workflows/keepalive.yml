name: Anti-pause Supabase

# Le plan gratuit Supabase met un projet en pause après ~1 semaine d'inactivité.
# Ce workflow fait un GET léger toutes les 48h pour que le projet reste actif,
# même si personne n'a lancé l'app entre-temps.
on:
  schedule:
    - cron: "0 6 */2 * *" # toutes les 48h à 6h UTC
  workflow_dispatch: {} # bouton "Run workflow" manuel dans l'onglet Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: GET léger sur l'API REST Supabase
        run: |
          curl -sf "${{ secrets.SUPABASE_URL }}/rest/v1/mm_sessions?select=code&limit=1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"
